services:
  # Disable the single backend from the base Compose file for this demo.
  backend:
    profiles: [single-backend-disabled]

  backend-1:
    build:
      context: ./TribetalkBackend
    restart: unless-stopped
    env_file: [./TribetalkBackend/.env]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NODE_ENV: development
      INSTANCE_NAME: backend-1
      LOAD_TEST_MODE: "true"
      LOAD_TEST_KEY: local-only-load-test
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-2:
    build:
      context: ./TribetalkBackend
    restart: unless-stopped
    env_file: [./TribetalkBackend/.env]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NODE_ENV: development
      INSTANCE_NAME: backend-2
      LOAD_TEST_MODE: "true"
      LOAD_TEST_KEY: local-only-load-test
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    volumes:
      - ./deploy/local-scale/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: !override
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }

  prometheus:
    volumes:
      - ./deploy/local-scale/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-scale-data:/prometheus
    depends_on: !override
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    profiles: [observability]
    command: ["--mongodb.uri=mongodb://mongo:27017", "--collect-all"]
    depends_on:
      mongo: { condition: service_healthy }

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0
    profiles: [observability]
    command: ["--es.uri=http://elasticsearch:9200"]
    depends_on:
      elasticsearch: { condition: service_healthy }

  grafana:
    volumes:
      - grafana-scale-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local-scale/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus-scale-data:
  grafana-scale-data:
