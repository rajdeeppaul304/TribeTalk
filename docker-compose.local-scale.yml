services:
  # Disable the single backend from the base Compose file for this demo.
  backend:
    profiles: [single-backend-disabled]

  backend-1:
    build:
      context: .
      dockerfile: TribetalkBackend/Dockerfile
    restart: unless-stopped
    cpus: "${BACKEND_1_CPUS:-1}"
    mem_limit: "${BACKEND_1_MEMORY:-1g}"
    env_file: [./TribetalkBackend/.env]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NODE_ENV: development
      INSTANCE_NAME: backend-1
      LOAD_TEST_MODE: "true"
      LOAD_TEST_KEY: local-only-load-test
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-2:
    build:
      context: .
      dockerfile: TribetalkBackend/Dockerfile
    restart: unless-stopped
    cpus: "${BACKEND_2_CPUS:-1}"
    mem_limit: "${BACKEND_2_MEMORY:-1g}"
    env_file: [./TribetalkBackend/.env]
    environment:
      MONGODB_URI: mongodb://mongo:27017
      PORT: 3000
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NODE_ENV: development
      INSTANCE_NAME: backend-2
      LOAD_TEST_MODE: "true"
      LOAD_TEST_KEY: local-only-load-test
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    cpus: "${FRONTEND_CPUS:-0.25}"
    mem_limit: "${FRONTEND_MEMORY:-256m}"
    volumes:
      - ./deploy/local-scale/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/local-scale/nginx-main.conf:/etc/nginx/nginx.conf:ro
    depends_on: !override
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }

  mongo:
    cpus: "${MONGO_CPUS:-0.5}"
    mem_limit: "${MONGO_MEMORY:-1g}"

  redis:
    cpus: "${REDIS_CPUS:-0.25}"
    mem_limit: "${REDIS_MEMORY:-256m}"

  elasticsearch:
    cpus: "${ELASTICSEARCH_CPUS:-1}"
    mem_limit: "${ELASTICSEARCH_MEMORY:-2g}"
    environment:
      ES_JAVA_OPTS: "${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}"
    ports:
      - "127.0.0.1:9200:9200"

  prometheus:
    cpus: "${PROMETHEUS_CPUS:-0.5}"
    mem_limit: "${PROMETHEUS_MEMORY:-512m}"
    volumes:
      - ./deploy/local-scale/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/tribetalk-alerts.yml:/etc/prometheus/tribetalk-alerts.yml:ro
      - prometheus-scale-data:/prometheus
    depends_on: !override
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }

  # Docker Desktop does not expose the Linux layer paths cAdvisor expects.
  # This small exporter uses the Docker Engine stats API instead.
  docker-stats-exporter:
    image: node:24-alpine
    cpus: "${DOCKER_STATS_EXPORTER_CPUS:-0.1}"
    mem_limit: "${DOCKER_STATS_EXPORTER_MEMORY:-64m}"
    profiles: [observability]
    environment:
      PORT: 9102
      TRACKED_SERVICES: backend-1,backend-2
    volumes:
      - ./tools/docker-stats-exporter.mjs:/app/docker-stats-exporter.mjs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["node", "/app/docker-stats-exporter.mjs"]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    cpus: "${REDIS_EXPORTER_CPUS:-0.1}"
    mem_limit: "${REDIS_EXPORTER_MEMORY:-128m}"
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    cpus: "${MONGODB_EXPORTER_CPUS:-0.1}"
    mem_limit: "${MONGODB_EXPORTER_MEMORY:-128m}"
    profiles: [observability]
    command: ["--mongodb.uri=mongodb://mongo:27017", "--collect-all"]
    depends_on:
      mongo: { condition: service_healthy }

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0
    cpus: "${ELASTICSEARCH_EXPORTER_CPUS:-0.1}"
    mem_limit: "${ELASTICSEARCH_EXPORTER_MEMORY:-128m}"
    profiles: [observability]
    command: ["--es.uri=http://elasticsearch:9200"]
    depends_on:
      elasticsearch: { condition: service_healthy }

  grafana:
    cpus: "${GRAFANA_CPUS:-0.5}"
    mem_limit: "${GRAFANA_MEMORY:-512m}"
    volumes:
      - grafana-scale-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local-scale/grafana/dashboards:/var/lib/grafana/dashboards:ro

  loki:
    cpus: "${LOKI_CPUS:-0.25}"
    mem_limit: "${LOKI_MEMORY:-256m}"

  promtail:
    cpus: "${PROMTAIL_CPUS:-0.1}"
    mem_limit: "${PROMTAIL_MEMORY:-128m}"

volumes:
  prometheus-scale-data:
  grafana-scale-data:
