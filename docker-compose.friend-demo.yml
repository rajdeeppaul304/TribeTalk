services:
  # MongoDB 8 currently refuses to start on Linux kernels 6.19+.
  # The friend-demo VM uses MongoDB 7 for compatibility; production can
  # continue using the base compose version when its kernel is supported.
  mongo:
    image: mongo:7.0

  # The frontend is hosted by Vercel for this setup.
  frontend:
    profiles: [frontend-disabled]

  backend-1:
    environment:
      CORS_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
      COOKIE_SECURE: "true"
      NODE_ENV: production
      APP_URL: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}

  backend-2:
    environment:
      CORS_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
      COOKIE_SECURE: "true"
      NODE_ENV: production
      APP_URL: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/friend-demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1: { condition: service_healthy }
      backend-2: { condition: service_healthy }
      grafana: { condition: service_started }
      prometheus: { condition: service_started }

  prometheus:
    volumes:
      - ./deploy/friend-demo/prometheus.generated.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=${BACKEND_ORIGIN:-http://localhost:8080}/prometheus/
      - --web.route-prefix=/prometheus/

  grafana:
    volumes:
      - ./deploy/friend-demo/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SERVER_ROOT_URL: ${BACKEND_ORIGIN:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      gateway: { condition: service_started }
