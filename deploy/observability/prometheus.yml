global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/tribetalk-alerts.yml

scrape_configs:
  - job_name: tribetalk-backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:3000"]
    # Replace this placeholder with the same METRICS_TOKEN used by the backend.
    params:
      token: ["replace-with-metrics-token"]
