global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/tribetalk-alerts.yml

scrape_configs:
  - job_name: tribetalk-backend
    metrics_path: /api/metrics
    params:
      token: ["__METRICS_TOKEN__"]
    static_configs:
      - targets: ["backend-1:3000"]
        labels: { replica: backend-1 }
      - targets: ["backend-2:3000"]
        labels: { replica: backend-2 }

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
  - job_name: elasticsearch
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]
  - job_name: docker-stats
    static_configs:
      - targets: ["docker-stats-exporter:9102"]
