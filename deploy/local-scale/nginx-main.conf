worker_processes auto;
worker_rlimit_nofile 20000;

events {
    worker_connections 20000;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Keep Engine.IO polling handshakes sticky, but distribute websocket-only
    # clients (the local ramp) across both replicas.
    map $http_upgrade $socket_backend {
        default tribetalk_backends_sticky;
        websocket tribetalk_backends_websocket;
    }

    include /etc/nginx/conf.d/*.conf;
}
