upstream tribetalk_backends {
    # Engine.IO's initial polling handshake is stateful. Keep one browser
    # session on one replica; Redis still synchronizes events across replicas.
    ip_hash;
    server backend-1:3000;
    server backend-2:3000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://tribetalk_backends;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://tribetalk_backends;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
    }

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|webp|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
